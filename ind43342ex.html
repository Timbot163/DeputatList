<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GD Депутат Лист</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0e14;--card:#141822;--card2:#1a1f2d;--line:#252b3b;--tx:#e8ecf8;--mu:#8b93ab;--acc:#ff4d6d;--ease:cubic-bezier(.4,0,.2,1)}
body[data-t=real]{--acc:#ff9f1c}body[data-t=waves]{--acc:#00b4d8}body[data-t=players]{--acc:#a78bfa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 "Chakra Petch","Exo 2",system-ui,sans-serif}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
button,a,input{transition:background-color .3s var(--ease),border-color .3s var(--ease),color .3s var(--ease),box-shadow .3s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fade,#modal:not([hidden]){animation:fade .35s var(--ease)}
header{position:sticky;top:0;z-index:5;background:#0c0e14e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{max-width:1100px;margin:auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.logo{margin:0;font-size:1.25rem;font-weight:700;white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;flex:1 1 380px}
nav button{white-space:nowrap;background:none;border:0;color:var(--mu);font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;box-shadow:inset 0 -2px transparent}
nav button:hover{color:var(--tx)}
nav button.on{color:#fff;box-shadow:inset 0 -2px var(--acc)}
#q{flex:1 1 200px;max-width:280px;background:var(--card);border:1px solid var(--line);color:var(--tx);font:inherit;padding:8px 14px;border-radius:999px}
#q:focus{border-color:var(--acc);outline:0}
#adm{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-block;background:var(--card);border:1px solid var(--line);color:var(--tx);font:inherit;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--acc);background:var(--card2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#0a0c14}
.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{color:#ff6b6b}
#warn{max-width:1060px;margin:16px auto 0;padding:12px 16px;border:1px solid #ff9f1c;border-radius:12px;background:#2a1f0c}
main{max-width:1100px;margin:auto;padding:20px}
#seg{display:flex;gap:8px;flex-wrap:wrap}
#seg:not(:empty){margin-bottom:16px}
.sg{background:none;border:1px solid var(--line);color:var(--mu);font:inherit;padding:5px 14px;border-radius:999px;cursor:pointer}
.sg:hover{color:var(--tx)}
.sg.on{border-color:var(--acc);color:var(--tx);background:var(--card)}
.card{display:grid;grid-template-columns:210px minmax(0,1fr) auto;gap:18px;align-items:center;width:100%;padding:10px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:inherit;font:inherit;text-align:left;cursor:pointer}
.card:hover{background:var(--card2);border-color:color-mix(in srgb,var(--acc) 60%,var(--line))}
.card.row{grid-template-columns:72px minmax(0,1fr) auto;padding:14px 18px}
.th{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#1b2133,#10131b)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th b{position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;color:#ffffff26}
.inf{display:grid;gap:2px;min-width:0}
.nm{font-size:1.15rem;font-weight:600;overflow-wrap:anywhere}
.inf small{color:var(--mu)}
.side{color:var(--mu);font-weight:600;padding-right:8px;white-space:nowrap}
.rk{font-style:normal;font-weight:700;color:var(--mu)}
.card.row .rk{font-size:1.5rem}
.r1{color:#ffd700}.r2{color:#c7d0dc}.r3{color:#cd7f32}
.back{margin-bottom:16px}
.lp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,3fr);gap:20px;align-items:stretch}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel h2{margin:0 0 4px;font-size:1.6rem;line-height:1.2}
h3{margin:22px 0 8px;font-size:1.05rem;color:var(--acc)}
.panel>h3:first-child,.lp>div>h3:first-child{margin-top:0}
.big{margin:0;color:var(--mu);font-size:1.1rem}.big b{color:var(--acc)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:16px 0}
dt{color:var(--mu)}dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.vid{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.recs{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line)}
.rec:last-child{border:0}.rec a{color:var(--acc);text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;background:#1b2133;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:.92rem;color:inherit;text-decoration:none}
a.chip:hover{border-color:var(--acc)}
.chip.gold{border-color:#ffd70066;color:#ffd700}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.vid+.acts,.lp .acts{margin-top:16px}
.empty{color:var(--mu);padding:24px 4px}
#modal{position:fixed;inset:0;z-index:20;background:#000a;display:grid;place-items:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(440px,100%);max-height:90vh;overflow:auto}
.box h2{margin:0 0 12px;font-size:1.3rem}
.box label{display:block;margin-bottom:10px;color:var(--mu);font-size:.92rem}
.box input,.box textarea{display:block;width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--line);color:var(--tx);font:inherit;padding:8px 10px;border-radius:8px}
.box input:focus,.box textarea:focus{border-color:var(--acc);outline:0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;background:#222a3d;padding:10px 16px;border-radius:10px;max-width:90vw}
.lp .panel dl{grid-template-columns:1fr;gap:2px}.lp .panel dd{margin-bottom:10px}
.lp .acts{flex-direction:column}.lp .acts .btn{text-align:center}
.bn{display:block;width:100%;aspect-ratio:21/6;object-fit:cover;border-radius:14px;margin-bottom:20px;background:var(--card)}
.fv{display:flex;align-items:center;gap:12px;margin:16px 0;padding:14px 18px;background:var(--card);border:1px solid #ffd70055;border-radius:14px}
.fv span{color:var(--mu)}.fv b{color:#ffd700;font-size:1.15rem}
@media(max-width:820px){.lp{grid-template-columns:1fr}.card{grid-template-columns:130px minmax(0,1fr) auto;gap:12px}.nm{font-size:1rem}}
#vbar{max-width:1060px;margin:16px auto 0;padding:12px 16px;border:1px solid var(--acc);border-radius:12px;background:var(--card);display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center}
#vbar span{flex:1 1 260px}
.chat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.4fr);gap:16px}
.cside{display:grid;gap:10px;align-content:start}
.cform{display:flex;gap:8px}
.cform input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--tx);font:inherit;padding:8px 12px;border-radius:10px}
.cform input:focus{border-color:var(--acc);outline:0}
.cform{flex-wrap:wrap}.cform select{background:var(--card);border:1px solid var(--line);color:var(--tx);font:inherit;padding:8px 10px;border-radius:10px}
.cform input:disabled{opacity:.5}
.conv{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:inherit;font:inherit;padding:10px 14px;border-radius:12px;cursor:pointer;margin-bottom:8px}
.conv:hover,.conv.on{border-color:var(--acc)}
.cmain{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;height:62vh}
.cmain h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line)}
#msgs{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.m{max-width:75%;padding:8px 12px;border-radius:12px;background:#1b2133;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:color-mix(in srgb,var(--acc) 30%,#1b2133)}
.m small{display:block;color:var(--mu);font-size:.75rem}
.cmain .cform{padding:12px;border-top:1px solid var(--line)}
.sub{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.sub h3{margin:0 0 6px}.sub p{margin:6px 0;overflow-wrap:anywhere}.sub .st{color:var(--mu)}.sub a{color:var(--acc)}
@media(max-width:820px){.chat{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-t="levels">
<header><div class="top">
 <h1 class="logo">GD Депутат Лист</h1>
 <nav id="tabs"></nav>
 <input id="q" type="search" autocomplete="off">
 <div id="adm"></div>
</div></header>
<div id="vbar" hidden></div>
<div id="warn" hidden>Сайт ещё не подключён к Firebase. Откройте файл в редакторе и вставьте свой <b>firebaseConfig</b> в начале скрипта (Firebase Console → Настройки проекта → Ваши приложения).</div>
<main><div id="seg"></div><div id="view"></div></main>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* ===== 1. ПОДКЛЮЧЕНИЕ К FIREBASE: вставьте данные своего проекта ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCZ__WFeBIH9Ti_j25HAyVWuN6GzzUsnnY",
  authDomain: "deputat-list.firebaseapp.com",
  projectId: "deputat-list",
  appId: "1:295409539252:web:fe40184ffc0e5075449fe1"
};
/* Названия коллекций в вашей базе */
const ADMIN_EMAIL = "deputat.admin@gmail.com"; /* только эта почта видит кнопки управления */
const TABS = {
  levels: {col:"levels",      label:"Депутат Лист",  icon:"👹", add:"Добавить уровень",      ph:"Поиск по названию, автору или #позиции"},
  real:   {col:"real_demons", label:"Real List",     icon:"🔥", add:"Добавить Real уровень", ph:"Поиск по названию, автору или #позиции"},
  waves:  {col:"waves",       label:"Wave List",     icon:"🌊", add:"Добавить вейв",         ph:"Поиск вейв-челленджей"},
  players:{col:"players",     label:"Топ Игроков",   icon:"🏆", add:"Добавить игрока",       ph:"Поиск по нику, биографии или уровню"},
  countries:{derived:1,label:"Страны",icon:"🌍",add:"",ph:"Поиск по стране"},
  subs:{derived:1,auth:1,label:"Заявки",icon:"📨",add:"",ph:"Заявки"},
  chat:{derived:1,auth:1,label:"Чат",icon:"💬",add:"",ph:"Чат"},
  mod:{derived:1,auth:1,staff:1,label:"Модерация",icon:"🛡",add:"",ph:"Модерация"}
};
/* ================================================================== */

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pick=(d,...k)=>{for(const x of k)if(d[x]!=null&&d[x]!=="")return d[x];return ""};
const yt=u=>(String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/)||[])[1]||"";
const safe=u=>{u=String(u||"").trim();if(!u)return"";if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u="https://"+u;return/^https?:\/\//i.test(u)?u:""};
const arr=v=>Array.isArray(v)?v:v&&typeof v==="object"?Object.values(v):typeof v==="string"&&v?v.split(","):[];
const cs=c=>!c||typeof c!=="object"?String(c??""):`${c.level||c.name||""} — ${c.percent??c.progress??100}%`;
const rs=r=>!r||typeof r!=="object"?String(r??""):`${r.player||r.name||""} — ${r.percent??r.progress??100}%`;
const T=()=>TABS[tab];

let tab="levels",sel=null,q="",admin=false,db,auth,seg="all";
const loaded={},seeding={};
/* Админ вошёл, а список пуст: сразу загружаем Топ-100 */
function offer(){
  if(!admin)return;
  ["levels","real"].forEach(k=>{
    if(loaded[k]&&!data[k].length&&!seeding[k]){seeding[k]=true;seedTop(k).catch(e=>{seeding[k]=false;alert(msg(e))})}
  });
}
const data={levels:[],real:[],waves:[],players:[],countries:[],subs:[],chat:[]};
const ok=!firebaseConfig.apiKey.startsWith("ВСТАВЬТЕ");

/* Приводим документы Firestore к единому виду (понимает разные названия полей) */
function norm(k,doc){
  const d=doc.data(),id=doc.id;
  if(k==="players")return{id,accountId:pick(d,"accountId"),country:pick(d,"country"),name:pick(d,"name","nick","nickname"),points:+pick(d,"points","pts")||0,bio:pick(d,"bio","description"),verified:arr(d.verified||d.verifiedLevels),completed:arr(d.completed||d.beaten)};
  return{id,pos:+pick(d,"position","rank","pos")||0,name:pick(d,"name","title"),publisher:pick(d,"publisher","creator"),verifier:pick(d,"verifier"),levelId:pick(d,"levelId","level_id","gdId"),req:pick(d,"requirement","qualification","percent"),first:pick(d,"firstVictor","first_victor"),video:pick(d,"video","videoUrl","youtube"),banner:pick(d,"banner","cover"),records:arr(d.records)};
}

if(ok){
  firebase.initializeApp(firebaseConfig);
  db=firebase.firestore();auth=firebase.auth();
  auth.onAuthStateChanged(onAuth);
  Object.entries(TABS).filter(([k,t])=>!t.derived).forEach(([k,t])=>db.collection(t.col).onSnapshot(s=>{
    data[k]=s.docs.map(x=>norm(k,x)).sort(k==="players"?(a,b)=>b.points-a.points||a.name.localeCompare(b.name):(a,b)=>a.pos-b.pos);
    if(k==="players")data.countries=byCountry(data.players);
    if(k===tab||(k==="players"&&tab==="countries"))render();
    if(!s.metadata.fromCache)loaded[k]=true;
    offer();
  },e=>{const w=$("#warn");w.hidden=false;w.textContent="Не удалось загрузить данные из Firestore: "+e.message+". Проверьте, что база создана и правила опубликованы."}));
}else $("#warn").hidden=false;

/* ===== Отрисовка ===== */
function render(anim){
  document.body.dataset.t=tab;
  $("#q").placeholder=T().ph;
  $("#tabs").innerHTML=Object.entries(TABS).filter(([k,t])=>(!t.auth||user)&&(!t.staff||staff())).map(([k,t])=>`<button class="${k===tab?"on":""}" data-tab="${k}">${t.icon} ${t.label}</button>`).join("");
  $("#adm").innerHTML=!ok?"":admin
    ?`${T().add?`<button class="btn pri" data-act="add">+ ${T().add}</button>`:""}${tab==="levels"||tab==="real"?'<button class="btn" data-act="reset">🔄 Загрузить Топ-100</button>':""}<button class="btn" data-act="out">Выйти</button>`
    :user?`<button class="btn" data-act="me">👤 ${esc(me.nick||user.email)}${me.pubId?" (ID "+me.pubId+")":""}</button><button class="btn" data-act="out">Выйти</button>`:'<button class="btn" data-act="login">Войти</button><button class="btn pri" data-act="reg">Регистрация</button>';

  vbar();
  if(tab==="chat"||tab==="subs"||tab==="mod"){$("#seg").innerHTML="";extra(anim);return}
  const all=data[tab].map((x,i)=>({...x,rank:(tab==="levels"||tab==="real"||tab==="waves")?(x.pos||i+1):i+1}));
  const cur=sel&&all.find(x=>x.id===sel),ranked=tab==="levels"||tab==="real";
  $("#seg").innerHTML=ranked&&!cur?[["all","Все"],["main","Main List (1–75)"],["ext","Extended (76–100)"]].map(([k,l])=>`<button class="sg ${k===seg?"on":""}" data-seg="${k}">${l}</button>`).join(""):"";
  const f=q.trim().toLowerCase();
  const items=all.filter(x=>(seg==="all"||!ranked||(seg==="main")===(x.rank<=75))&&(!f||(/^#\d+$/.test(f)?String(x.rank)===f.slice(1):
    [x.name,x.publisher,x.verifier,x.bio,x.country,...(x.completed||[]).map(cs)].join(" ").toLowerCase().includes(f))));

  let h;
  if(cur){try{h=detail(cur)}catch(err){h='<button class="btn back" data-act="back">← К списку</button><p class="empty">Не удалось показать запись: '+esc(err.message)+'</p>'}}
  else h=items.length?items.map(card).join(""):`<p class="empty">${f?"Ничего не найдено. Попробуйте другой запрос.":(tab==="countries"?"Пока нет стран. Укажите игрокам страну (например, RU), и рейтинг появится здесь.":"Здесь пока пусто."+(admin?" Добавьте запись кнопкой сверху.":" Администратор может заполнить список после входа."))}</p>`+(!f&&ranked&&admin?'<button class="btn pri" data-act="reset">Загрузить Топ-100</button>':"");
  const v=$("#view");v.innerHTML=h;
  if(anim){scrollTo(0,0);v.classList.remove("fade");void v.offsetWidth;v.classList.add("fade")}
}

const flag=c=>{c=String(c||"").trim();return/^[a-z]{2}$/i.test(c)?String.fromCodePoint(...[...c.toUpperCase()].map(ch=>127397+ch.charCodeAt(0)))+" "+c.toUpperCase():c};
const img=u=>{u=String(u||"").trim();return u.startsWith("data:image/")?(/^data:image\/(jpeg|png|webp|gif);base64,[\w+\/=]+$/.test(u)?u:""):safe(u)};
/* Рейтинг стран: сумма очков игроков одной страны */
function byCountry(P){
  const m={};
  P.forEach(p=>{const n=String(p.country||"").trim();if(!n)return;const k=n.toLowerCase(),g=m[k]||(m[k]={id:k,name:flag(n),points:0,players:[]});g.points+=p.points;g.players.push(p)});
  return Object.values(m).sort((a,b)=>b.points-a.points||a.name.localeCompare(b.name));
}
/* Картинка с устройства сжимается и хранится прямо в документе */
function shrink(file){return new Promise((res,rej)=>{
  const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{
    const c=document.createElement("canvas");c.width=Math.min(1200,im.width);c.height=Math.round(im.height*c.width/im.width);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    let d=c.toDataURL("image/jpeg",.8);if(d.length>800000)d=c.toDataURL("image/jpeg",.5);
    d.length>900000?rej(new Error("Картинка слишком большая")):res(d);
  };
  im.onerror=()=>rej(new Error("Не удалось прочитать картинку"));im.src=u;
})}

function card(x){
  const rk=`<i class="rk r${x.rank<4?x.rank:0}">#${x.rank}</i>`,sid=`data-sel="${esc(x.id)}"`;
  if(tab==="countries")return `<button class="card row" ${sid}>${rk}<span class="nm">${esc(x.name)}</span><span class="side">${x.points} PTS, игроков: ${x.players.length}</span></button>`;
  if(tab==="players")return `<button class="card row" ${sid}>${rk}<span class="nm">${x.country?esc(flag(x.country))+" ":""}${esc(x.name)}</span><span class="side">${x.points} PTS</span></button>`;
  const b=img(x.banner),id=yt(safe(x.video));
  return `<button class="card" ${sid}><span class="th">${b?`<img loading="lazy" alt="" src="${esc(b)}">`:id?`<img loading="lazy" alt="" src="https://i.ytimg.com/vi/${id}/mqdefault.jpg">`:`<b>#${x.rank}</b>`}</span><span class="inf"><span class="nm">${rk} ${esc(x.name)}</span>${x.publisher?`<small>Создатель: ${esc(x.publisher)}</small>`:""}${x.verifier?`<small>Верификатор: ${esc(x.verifier)}</small>`:""}</span><span class="side">${x.req!==""?esc(x.req)+"%":""}</span></button>`;
}

function detail(x){
  const back='<button class="btn back" data-act="back">← К списку</button>';
  const chips=(a,fn,cls="")=>`<div class="chips">${a.map(v=>{const l=v&&typeof v==="object"?safe(v.link):"";return l?`<a class="chip ${cls}" href="${esc(l)}" target="_blank" rel="noopener">${esc(fn(v))} ↗</a>`:`<span class="chip ${cls}">${esc(fn(v))}</span>`}).join("")}</div>`;

const col=()=>db.collection(T().col);
async function run(ops){for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}}

async function addItem(v){
  if(tab==="players"){await col().add(v);return}
  const L=data[tab],pos=Math.min(Math.max(v.position||L.length+1,1),L.length+1);
  /* всё, что ниже новой позиции, сдвигается на одну вниз */
  const ops=L.map((x,i)=>[x,i+1>=pos?i+2:i+1]).filter(([x,p])=>x.pos!==p).map(([x,p])=>b=>b.update(col().doc(x.id),{position:p}));
  ops.push(b=>b.set(col().doc(),{...v,position:pos,...(tab==="players"?{}:{records:[]})}));
  await run(ops);
}
/* Перемещение: n — номер позиции, а при rel — сдвиг (-1 выше, +1 ниже) */
async function moveItem(n,rel){
  const L=data[tab],i=L.findIndex(x=>x.id===sel);
  if(i<0)return;
  const to=Math.min(Math.max(Math.round(rel?i+1+n:n),1),L.length);
  if(to===i+1)return;
  const M=[...L];M.splice(to-1,0,M.splice(i,1)[0]);
  await run(M.map((x,k)=>[x,k+1]).filter(([x,p])=>x.pos!==p).map(([x,p])=>b=>b.update(col().doc(x.id),{position:p})));
}
async function delItem(){
  if(!sel||!confirm("Удалить эту запись?"))return;
  const id=sel;sel=null;
  const ops=[b=>b.delete(col().doc(id))];
  if(tab!=="players")data[tab].filter(x=>x.id!==id).forEach((x,i)=>{if(x.pos!==i+1)ops.push(b=>b.update(col().doc(x.id),{position:i+1}))});
  await run(ops);
}

  for(let i=0;i<8;i++){

    try{await db.collection("pubids").doc(id).set({uid:u.uid})}catch(e){if(e.code==="permission-denied")continue;throw e}

async function banUser(t){

  for(const k of ["levels","real","waves"]){

    q.docs.forEach(d=>{const r=arr(d.data().records),keep=r.filter(x=>!(x&&x.uid===t.uid));if(keep.length!==r.length){n+=r.length-keep.length;ops.push(b=>b.update(d.ref,{records:keep}))}});

function subCard(s){
  const st={pending:"⏳ На проверке",approved:"✅ Принята",rejected:"❌ Отклонена"}[s.status]||s.status,v=safe(s.video),x=safe(s.extra);
  return `<div class="sub"><h3>${esc(s.levelName)} (${esc(s.percent)}%)</h3><p>Игрок: <b>${esc(s.nick)}</b> (ID ${esc(s.pubId||"—")})</p><p>Видео: <a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a></p>${x?`<p>Дополнительно: <a href="${esc(x)}" target="_blank" rel="noopener">${esc(x)}</a></p>`:""}<p>Доказательства: ${esc(s.proof)}</p><p class="st">${st}</p>${staff()?`<div class="acts"><button class="btn pri" data-act="sok" data-id="${esc(s.id)}">Принять</button><button class="btn bad" data-act="sno" data-id="${esc(s.id)}">Отклонить</button></div>`:""}</div>`;
}

/* Чат: комната = два аккаунта, ищем собеседника по публичному ID */
const chatShell=()=>vok()?`<div class="chat" id="cbox"><div class="cside"><p class="big">Ваш ID: <b>${me.pubId||"—"}</b></p><form class="cform" id="idf"><input name="id" inputmode="numeric" placeholder="ID аккаунта" required><button class="btn pri">Открыть</button></form><div id="clist"></div></div><div class="cmain"><h3 id="ctitle"></h3><div id="msgs"></div><form class="cform" id="cf"><input name="t" placeholder="${rl.muted&&!admin?"Модератор запретил вам писать":"Сообщение"}" autocomplete="off" maxlength="1000" ${rl.muted&&!admin?"disabled":""}><button class="btn pri" ${rl.muted&&!admin?"disabled":""}>Отправить</button></form></div></div>`:'<p class="empty">Подтвердите почту по ссылке из письма, и чат станет доступен.</p>';
function extra(anim){
  const v=$("#view");
  if(tab==="mod"){if(anim||!$("#mbox"))v.innerHTML=modShell();updMod()}
  else if(tab==="subs")v.innerHTML=data.subs.length?data.subs.map(subCard).join(""):`<p class="empty">${staff()?"Новых заявок нет.":"Вы ещё не подавали заявок. Откройте уровень и нажмите «Подать рекорд»."}</p>`;
  else{if(anim||!$("#cbox"))v.innerHTML=chatShell();updChat()}
  if(anim){scrollTo(0,0);v.classList.remove("fade");void v.offsetWidth;v.classList.add("fade")}
}
function updChat(){
  const cl=$("#clist");if(!cl)return;
  cl.innerHTML=chat.list.map(c=>`<button class="conv ${c.id===chat.cid?"on":""}" data-act="conv" data-id="${esc(c.id)}">${esc(c.name)}</button>`).join("")||'<p class="empty">Чатов пока нет.</p>';
  $("#ctitle").textContent=chat.cid?"Чат с "+chat.name:"Выберите чат или введите ID";
  const m=$("#msgs");
  m.innerHTML=chat.msgs.map(x=>`<div class="m ${x.from===user.uid?"me":""}">${esc(x.text)}<small>${x.at?new Date(x.at.seconds*1000).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):""}</small></div>`).join("");
  m.scrollTop=m.scrollHeight;
}
function watchChats(){
  if(!vok())return;
  unsubChats&&unsubChats();
  unsubChats=db.collection("chats").where("members","array-contains",user.uid).onSnapshot(s=>{
    chat.list=s.docs.map(d=>{const c=d.data(),o=c.members.find(m=>m!==user.uid);return{id:d.id,name:(c.names&&c.names[o])||"Аккаунт",at:c.updated?.seconds||0}}).sort((a,b)=>b.at-a.at);
    if(tab==="chat")updChat();
  },e=>toast("Чат недоступен: "+e.message));
}
function selectChat(cid,name){
  unsubMsgs&&unsubMsgs();chat.cid=cid;chat.name=name;chat.msgs=[];
  unsubMsgs=db.collection("chats").doc(cid).collection("messages").orderBy("at").limitToLast(200).onSnapshot(s=>{chat.msgs=s.docs.map(d=>d.data());updChat()},e=>toast("Не удалось загрузить сообщения: "+e.message));
  updChat();
}
async function openChat(pub){
  if(!vok())throw new Error("Подтвердите почту, чтобы пользоваться чатом");
  const p=await db.collection("pubids").doc(String(pub).trim()).get();
  if(!p.exists)throw new Error("Аккаунт с таким ID не найден");
  const ou=p.data().uid;if(ou===user.uid)throw new Error("Это ваш собственный ID");
  const od=await db.collection("users").doc(ou).get(),nick=(od.data()||{}).nick||"Аккаунт";
  const cid=[user.uid,ou].sort().join("_");
  await db.collection("chats").doc(cid).set({members:[user.uid,ou],names:{[user.uid]:me.nick||"",[ou]:nick},updated:TS()},{merge:true});
  selectChat(cid,nick);
}
document.addEventListener("submit",async e=>{
  const f=e.target;if(!["idf","cf","mf"].includes(f.id))return;
  e.preventDefault();
  try{
    if(f.id==="mf"){await modApply(f.elements.a.value,f.elements.id.value);f.reset()}
    else if(f.id==="idf"){await openChat(f.elements.id.value);f.reset()}
    else{
      const t=f.elements.t.value.trim();
      if(!chat.cid)return toast("Сначала выберите чат или введите ID собеседника");
      if(rl.muted&&!admin)return toast("Модератор запретил вам писать");
      if(!t)return;f.reset();
      await db.collection("chats").doc(chat.cid).collection("messages").add({from:user.uid,text:t.slice(0,1000),at:TS()});
      db.collection("chats").doc(chat.cid).update({updated:TS()}).catch(()=>{});
    }
  }catch(err){alert(msg(err))}
});

/* ===== Действия и события ===== */
const msg=e=>{const c=e.code||"";
  if(c==="permission-denied")return "Нет прав на это действие. Войдите в аккаунт (для заявок и чата нужна подтверждённая почта).";
  if(c==="auth/email-already-in-use")return "Эта почта уже зарегистрирована.";
  if(c==="auth/weak-password")return "Пароль слишком простой (минимум 6 символов).";
  if(c==="auth/invalid-email")return "Некорректная почта.";
  if(c==="auth/too-many-requests")return "Слишком много попыток, подождите немного.";
  if(c.startsWith("auth/"))return "Неверная почта или пароль.";
  return e.message};
function toast(s){const t=$("#toast");t.textContent=s;t.hidden=false;clearTimeout(toast.id);toast.id=setTimeout(()=>t.hidden=true,3500)}
const act={
  add:()=>form(T().add,FIELDS[tab],v=>addItem(prep(v))),
  del:delItem,reset:()=>seedTop(),cover:()=>form("Обложка уровня",[{k:"banner",l:"Ссылка на картинку"},{k:"bannerFile",l:"Или загрузите картинку с устройства",t:"file"}],v=>{const b=v.bannerFile||v.banner;if(!b)throw new Error("Укажите ссылку или выберите файл");return col().doc(sel).update({banner:b})}),
  editp:()=>form("Изменить игрока",[{k:"points",l:"Очки (пусто — не менять)",t:"number"},{k:"country",l:"Страна, например RU (пусто — не менять)"},{k:"accountId",l:"ID аккаунта (пусто — не менять)",t:"number"},{k:"bio",l:"Описание (пусто — не менять)",a:1}],v=>{if(!Object.keys(v).length)throw new Error("Заполните хотя бы одно поле");return col().doc(sel).update(v)}),
  up:()=>moveItem(-1,1),down:()=>moveItem(1,1),goto:()=>form("Переместить на позицию",[{k:"n",l:"Номер позиции",t:"number",r:1}],v=>moveItem(v.n)),
  rec:()=>form("Добавить рекорд",[{k:"player",l:"Игрок",r:1},{k:"percent",l:"Прогресс, %",t:"number",r:1},{k:"link",l:"Ссылка на прохождение (необязательно)"}],v=>col().doc(sel).update({records:firebase.firestore.FieldValue.arrayUnion(v)})),
  login:()=>form("Вход",[{k:"email",l:"Почта",t:"email",r:1},{k:"password",l:"Пароль",t:"password",r:1}],v=>auth.signInWithEmailAndPassword(v.email,v.password),"Войти"),
  out:()=>auth.signOut(),
  reg:()=>form("Регистрация",[{k:"nick",l:"Ник (его увидят другие)",r:1},{k:"email",l:"Почта",t:"email",r:1},{k:"password",l:"Пароль (минимум 6 символов)",t:"password",r:1}],register,"Создать аккаунт"),
  me:()=>alert("Ваш ID для чата: "+(me.pubId||"ещё не выдан")+"\nНазовите его, чтобы вам могли написать."),
  resend:async()=>{await user.sendEmailVerification();toast("Письмо отправлено ещё раз")},
  recheck:async()=>{await user.reload();await user.getIdToken(true);user=auth.currentUser;watchChats();render();if(!user.emailVerified)toast("Почта пока не подтверждена")},
  submit:()=>{
    if(!user)return act.login();
    if(!vok())throw new Error("Сначала подтвердите почту по ссылке из письма.");
    const lv=data[tab].find(x=>x.id===sel);
    form("Подать рекорд: "+lv.name,[{k:"percent",l:"Прогресс, %",t:"number",r:1},{k:"video",l:"Ссылка на видео рекорда (обязательно)",r:1},{k:"proof",l:"Доказательство легитимности: сырая запись, клики и звук, FPS, устройство (минимум 20 символов)",a:1},{k:"extra",l:"Дополнительная ссылка (необязательно)"}],v=>submitRec(lv,v),"Отправить заявку");
  },
  sok:d=>decide(d.id,true),sno:d=>decide(d.id,false),
  chatid:d=>{tab="chat";render(1);return openChat(d.id)},
  undo:d=>{if(!["bans","mutes","mods"].includes(d.c)||!confirm("Снять ограничение?"))return;return db.collection(d.c).doc(d.id).delete()},
  conv:d=>{const c=chat.list.find(x=>x.id===d.id);if(c)selectChat(c.id,c.name)},
  close:()=>$("#modal").hidden=true,
  back:()=>{sel=null;render(1)}
};
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-tab],[data-sel],[data-seg],[data-act]");
  if(el){
    const d=el.dataset;
    if(d.tab){tab=d.tab;sel=null;seg="all";q="";$("#q").value="";render(1)}
    else if(d.sel){sel=d.sel;render(1)}
    else if(d.seg){seg=d.seg;render()}
    else try{await act[d.act](d)}catch(err){alert(msg(err))}
  }else if(e.target.id==="modal")$("#modal").hidden=true;
});
$("#q").addEventListener("input",e=>{q=e.target.value;sel=null;render()});
render();
</script>
</body>
</html>
